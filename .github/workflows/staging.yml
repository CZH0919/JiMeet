name: Staging checks
on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
permissions:
  contents: read
concurrency:
  group: staging-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: jimeet_ci
          POSTGRES_USER: jimeet_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DB_NAME: jimeet_ci
      DB_USER: jimeet_ci
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DEV_API_TARGET: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements/staging.txt
      - name: Check staging runtime settings
        run: python manage.py check --settings=config.settings.staging
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-staging-settings-validation-not-a-deployment-secret
          DJANGO_ALLOWED_HOSTS: localhost
          DB_NAME: jimeet_staging
          DB_USER: jimeet_staging
          PRIVATE_FILE_ROOT: /tmp/jimeet-staging-config-check
          STAGING_LOGIN_IDS: qa01
      - run: python manage.py test --noinput
        working-directory: backend
